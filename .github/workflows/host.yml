name: Desktop host
on:
  workflow_dispatch:
    inputs:
      window_diagnostics:
        description: 仅运行 macOS 窗口观察器诊断
        type: boolean
        default: false
      resize_trace:
        description: 记录窗口观察目标与调用栈
        type: boolean
        default: false
  push:
    paths: ['src/**', 'tests/**', 'scripts/**', 'styles.css', 'manifest.json', 'package.json', 'pnpm-lock.yaml', '.github/workflows/host.yml']
permissions:
  contents: read
jobs:
  host:
    if: ${{ !inputs.window_diagnostics }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      HB_DESKTOP: '1'
      HB_TRACE: '1'
      HB_RO_TRACE: ${{ inputs.resize_trace && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm prepare:runtime
      - run: node scripts/prepare-host-ci.mjs
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk fonts-noto-color-emoji
      - if: runner.os != 'Linux'
        run: pnpm test:host
      - if: runner.os == 'Linux'
        run: xvfb-run -a pnpm test:host
      - if: runner.os != 'Linux'
        run: pnpm test:multiwindow && pnpm test:accessibility && pnpm test:journey
      - if: runner.os == 'Linux'
        run: xvfb-run -a sh -c 'pnpm test:multiwindow && pnpm test:accessibility && pnpm test:journey'
      - run: pnpm package:candidate
      - run: node scripts/prepare-install.mjs --current
      - if: runner.os != 'Linux'
        run: pnpm test:install && pnpm test:frames
      - if: runner.os == 'Linux'
        run: xvfb-run -a sh -c 'pnpm test:install && pnpm test:frames'
      - run: node scripts/prepare-vault.mjs --suite=compat && node scripts/prepare-compatibility.mjs --core
      - if: runner.os != 'Linux'
        run: node scripts/test-compatibility.mjs --case=default
      - if: runner.os == 'Linux'
        run: xvfb-run -a sh -c 'node scripts/test-compatibility.mjs --case=default'
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: host-${{ matrix.os }}
          include-hidden-files: true
          path: |
            docs/verification/host-*-results.json
            docs/verification/host-results.json
            docs/verification/host-environment.json
            docs/verification/images/
            docs/verification/compatibility/default.json
            .local/exports/pdf/*.pdf
            dist/**/candidate.json
            dist/**/highlight-boost.zip
  window-diagnostics:
    if: ${{ inputs.window_diagnostics }}
    runs-on: macos-latest
    timeout-minutes: 10
    env:
      HB_DESKTOP: '1'
      HB_TRACE: '1'
      HB_RO_TRACE: ${{ inputs.resize_trace && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm prepare:runtime
      - run: pnpm test:multiwindow
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: window-diagnostics
          path: docs/verification/host-multiwindow*-results.json
